build_phase8b_3b_diag:
  stage: build
  tags:
    - run_ishiguro_machine
  rules:
    - if: $RUN_PHASE8B_3B_DIAG == "true"
    - when: never
  script:
    - |
      & "$env:CI_PROJECT_DIR\tools\ci\build_phase8b_3b_diag.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -E2Studio "$env:E2STUDIO" `
        -Workspace "$env:PHASE8B_3B_WORKSPACE" `
        -LogFile "$env:CI_PROJECT_DIR\phase8b_3b_e2studio_build.log"
  artifacts:
    when: always
    paths:
      - phase8b_3b_e2studio_build.log
      - projects/renesas/rx72n_envision_kit/e2studio/boot_loader/HardwareDebug/*.mot
      - phase8b/Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - phase8b/Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - phase8b/Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 week

diag_phase8b_3b_boot:
  stage: flash
  extends:
    - .pi_flash_job
    - .pi_crypto_serial_job
    - .rx72n_set_matrix
  timeout: 8 minutes
  rules:
    - if: '$RUN_ONLY_DEVICE_SLOT != "" && $RUN_ONLY_DEVICE_SLOT != $DEVICE_SLOT'
      when: never
    - if: $RUN_PHASE8B_3B_DIAG == "true"
    - when: never
  needs:
    - job: build_phase8b_3b_diag
      artifacts: true
  variables:
    RSU_SEQ_NO: "1"
  script:
    - |
      set -euo pipefail
      source "$CI_PROJECT_DIR/tools/ci/acquire_pi_device_lock.sh" "$DEVICE_ID"
      . "$CI_PROJECT_DIR/tools/ci/load_rx72n_set_env.sh"
      bash "$CI_PROJECT_DIR/tools/ci/validate_pi_serial_path.sh" UART_PORT
      boot_mot="$CI_PROJECT_DIR/$E2STUDIO_PROJECTS/boot_loader/HardwareDebug/rx72n_boot_loader.mot"
      app_mot="$CI_PROJECT_DIR/$PHASE8B_E2STUDIO_PROJECTS/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/aws_ether_rx72n_envision_kit.mot"
      rsu="$CI_PROJECT_DIR/phase8b_3b_${DEVICE_ID}.rsu"
      download_log="$CI_PROJECT_DIR/phase8b_3b_download_${DEVICE_ID}.log"
      key="$CI_PROJECT_DIR/sample_keys/secp256r1.privatekey"
      reset_cmd="$RFP_CLI -device RX72x -tool ${RFP_TOOL} -if fine -run -noquery"
      if [[ ! -f "$boot_mot" ]]; then
        echo "ERROR: legacy boot_loader .mot not found: $boot_mot"
        exit 1
      fi
      if [[ ! -f "$app_mot" ]]; then
        echo "ERROR: phase8b app .mot not found: $app_mot"
        exit 1
      fi
      echo "=== Convert phase8b app .mot to legacy RSU ==="
      echo "  MOT: $app_mot"
      echo "  RSU: $rsu"
      echo "  Seq: $RSU_SEQ_NO"
      python3 "$CI_PROJECT_DIR/tools/mcu-tool-rx/mot_to_rsu.py" \
        --mot "$app_mot" --key "$key" -o "$rsu" --seq-no "$RSU_SEQ_NO"
      echo "=== Flash legacy boot_loader ==="
      echo "  MOT:  $boot_mot"
      echo "  Tool: $RFP_TOOL"
      "$RFP_CLI" -device RX72x -tool "$RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF -erase-chip -noquery
      "$RFP_CLI" -device RX72x -tool "$RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF -p "$boot_mot" -v -run -noquery
      echo "=== UART Download phase8b app via legacy boot_loader ==="
      echo "  Port:  $UART_PORT @ ${UART_BAUD_RATE}bps"
      echo "  Reset: $reset_cmd"
      python3 "$CI_PROJECT_DIR/test_scripts/uart_test/test_uart_download.py" \
        --rsu "$rsu" --port "$UART_PORT" --baud "$UART_BAUD_RATE" \
        --timeout 300 --diag --wait-for-ready --ready-timeout 60 \
        --reset-cmd "$reset_cmd" \
        --success-message "[phase8b] main_task entered" \
        --success-timeout 40 | tee "$download_log"
      if ! grep -F "[phase8b] main_task entered" "$download_log" >/dev/null; then
        echo "ERROR: phase8b boot marker was not observed after legacy boot_loader download."
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - phase8b_3b_*.rsu
      - phase8b_3b_download_*.log
    expire_in: 1 week
