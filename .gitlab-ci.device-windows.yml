.pc_device_job:
  tags:
    - run_ishiguro_machine
  resource_group: $DEVICE_RESOURCE_GROUP

.pc_flash_job:
  extends: .pc_device_job

.pc_pyserial_job:
  before_script:
    - python -m pip install --quiet --user pyserial

.pc_crypto_serial_job:
  before_script:
    - python -m pip install --quiet --user pyserial cryptography

flash_boot_loader:
  stage: flash_boot
  extends:
    - .pc_flash_job
    - .pc_pyserial_job
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - when: always
  needs:
    - job: build
      artifacts: true
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\flash_boot_loader.py"
      --mot "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\boot_loader\HardwareDebug\rx72n_boot_loader.mot"
      --rfp-cli "$env:RFP_CLI"
      --rfp-tool "$env:RFP_TOOL"
      --rfp-speed "$env:RFP_SPEED"
      --uart-port "$env:UART_PORT"
      --uart-baud "$env:UART_BAUD_RATE"
      --run-healthcheck "$env:RUN_HW_HEALTHCHECK"
      --project-dir "$env:CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - boot_loader_hardware_state.log
      - boot_loader_health.log
    expire_in: 1 week

rfp_soak_test:
  stage: health
  extends:
    - .pc_flash_job
  timeout: 30 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
    - when: never
  needs:
    - job: build
      artifacts: true
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\rfp_soak_test.py"
      --output-dir "$env:CI_PROJECT_DIR\rfp_soak_$env:DEVICE_ID"
      --loops "$env:RFP_SOAK_LOOPS"
      --sleep-seconds "$env:RFP_SOAK_SLEEP_SECONDS"
      --mode "$env:RFP_SOAK_MODE"
      --device RX72x
      --tool "$env:RFP_TOOL"
      --speed "$env:RFP_SPEED"
      --auth-id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF
      --rfp-cli "$env:RFP_CLI"
      --mot "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\boot_loader\HardwareDebug\rx72n_boot_loader.mot"
  artifacts:
    when: always
    paths:
      - rfp_soak_${DEVICE_ID}/
    expire_in: 1 week

download_aws_demos:
  stage: download
  extends:
    - .pc_flash_job
    - .pc_crypto_serial_job
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - when: always
  needs:
    - job: build
      artifacts: true
    - job: flash_boot_loader
      artifacts: false
  variables:
    RSU_SEQ_NO: "1"
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\download_aws_demos.py"
      --mot "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\aws_demos.mot"
      --key "$env:CI_PROJECT_DIR\sample_keys\secp256r1.privatekey"
      --rsu-out "$env:CI_PROJECT_DIR\userprog_$env:DEVICE_ID.rsu"
      --seq-no "$env:RSU_SEQ_NO"
      --uart-port "$env:UART_PORT"
      --uart-baud "$env:UART_BAUD_RATE"
      --rfp-cli "$env:RFP_CLI"
      --rfp-tool "$env:RFP_TOOL"
      --rfp-speed "$env:RFP_SPEED"
      --project-dir "$env:CI_PROJECT_DIR"
  artifacts:
    paths:
      - userprog_${DEVICE_ID}.rsu
    expire_in: 1 week

test_commands:
  stage: smoke_test
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 45 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - when: always
  needs:
    - job: download_aws_demos
      artifacts: false
    - job: capture_after_download_aws_demos
      optional: true
      artifacts: false
    - job: health_aws_demos_startup
      optional: true
      artifacts: false
  variables:
    COMMAND_TIMEOUT: "300"
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\test_commands.py"
      --command-port "$env:COMMAND_PORT"
      --command-baud "$env:COMMAND_BAUD_RATE"
      --command-timeout "$env:COMMAND_TIMEOUT"
      --project-dir "$env:CI_PROJECT_DIR"

test_screen_navigation:
  stage: smoke_test
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 3 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - when: always
  needs:
    - job: test_commands
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\test_screen_navigation.py"
      --command-port "$env:COMMAND_PORT"
      --command-baud "$env:COMMAND_BAUD_RATE"
      --project-dir "$env:CI_PROJECT_DIR"

provision_aws_credentials:
  stage: provision
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 5 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - if: $RUN_AWS_TESTS == "true"
  needs:
    - job: download_aws_demos
      artifacts: false
    - job: capture_after_download_aws_demos
      optional: true
      artifacts: false
    - job: health_aws_demos_startup
      optional: true
      artifacts: false
    - job: test_screen_navigation
      artifacts: false
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\provision_aws.py"
      --device-id "$env:DEVICE_ID"
      --codesigner-cert "$env:CI_PROJECT_DIR\sample_keys\secp256r1.crt"
      --command-port "$env:COMMAND_PORT"
      --mac-address "$env:MAC_ADDR"
      --allow-missing-write-confirmation
      --project-dir "$env:CI_PROJECT_DIR"

health_aws_demos_startup:
  stage: observe
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 4 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
    - when: never
  needs:
    - job: download_aws_demos
      artifacts: false
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\health_check.py"
      --command-port "$env:COMMAND_PORT"
      --command-baud "$env:COMMAND_BAUD_RATE"
      --project-dir "$env:CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - aws_demos_hardware_state.log
      - aws_demos_health.log
    expire_in: 1 week

confirm_aws_mqtt:
  stage: test
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 5 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - if: $RUN_AWS_TESTS == "true"
  needs:
    - job: test_screen_navigation
      artifacts: false
    - job: provision_aws_credentials
      artifacts: false
  retry:
    max: 1
    when: script_failure
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\confirm_aws_mqtt.py"
      --device-id "$env:DEVICE_ID"
      --uart-port "$env:UART_PORT"
      --uart-baud "$env:UART_BAUD_RATE"
      --command-port "$env:COMMAND_PORT"
      --command-baud "$env:COMMAND_BAUD_RATE"
      --project-dir "$env:CI_PROJECT_DIR"

test_sd_update:
  stage: test
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 10 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - if: $RUN_AWS_TESTS == "true" && $RUN_SD_UPDATE_TEST == "true"
  needs:
    - job: confirm_aws_mqtt
    - job: download_aws_demos
      artifacts: true
  script:
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\test_sd_update.py"
      --device-id "$env:DEVICE_ID"
      --rsu "$env:CI_PROJECT_DIR\userprog_$env:DEVICE_ID.rsu"
      --uart-port "$env:UART_PORT"
      --uart-baud "$env:UART_BAUD_RATE"
      --command-port "$env:COMMAND_PORT"
      --command-baud "$env:COMMAND_BAUD_RATE"
      --project-dir "$env:CI_PROJECT_DIR"

prepare_ota:
  stage: ota_prepare
  extends:
    - .pc_flash_job
    - .pc_crypto_serial_job
  timeout: 5 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_PREPARE_OTA_ONLY == "true"
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
    - if: $RUN_OTA_TEST == "true"
  dependencies:
    - build_ota
  script:
    - |
      if (($env:RUN_OTA_TEST -eq "true") -or ($env:RUN_OTA_BOUNDARY_ONLY -eq "true")) {
        python -u "$env:CI_PROJECT_DIR\tools\ci\ota_boundary_reservation.py" `
          --action acquire `
          --device-id "$env:DEVICE_ID" `
          --owner "$($env:CI_PROJECT_ID):$($env:CI_PIPELINE_ID):$($env:DEVICE_ID)" `
          --project-id "$env:CI_PROJECT_ID" `
          --pipeline-id "$env:CI_PIPELINE_ID" `
          --pipeline-url "$env:CI_PIPELINE_URL" `
          --ref "$env:CI_COMMIT_REF_NAME" `
          --state-dir "$env:OTA_BOUNDARY_RESERVATION_ROOT" `
          --stale-seconds "$env:OTA_BOUNDARY_RESERVATION_STALE_SECONDS"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
    - >-
      python "$env:CI_PROJECT_DIR\tools\ci\prepare_ota.py"
      --mot "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\boot_loader\HardwareDebug\rx72n_boot_loader.mot"
      --rsu "$env:CI_PROJECT_DIR\ota_v1.rsu"
      --uart-port "$env:UART_PORT"
      --uart-baud "$env:UART_BAUD_RATE"
      --command-port "$env:COMMAND_PORT"
      --command-baud "$env:COMMAND_BAUD_RATE"
      --device-id "$env:DEVICE_ID"
      --codesigner-cert "$env:CI_PROJECT_DIR\sample_keys\secp256r1.crt"
      --mac-address "$env:MAC_ADDR"
      --stop-after "$env:PREPARE_OTA_STOP_AFTER"
      --project-dir "$env:CI_PROJECT_DIR"
  artifacts:
    when: always
    paths:
      - prepare_ota_hardware_state.log
    expire_in: 1 week

ota_monitor:
  stage: ota_run
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  timeout: 15 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_V3_OTA == "true"
      when: never
    - if: $RUN_PREPARE_OTA_ONLY == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
    - if: $RUN_OTA_TEST == "true"
  dependencies: []
  script:
    - |
      $monitorResults = "$env:CI_PROJECT_DIR\ota_monitor_results_$env:DEVICE_ID.json"
      $monitorLog = "$env:CI_PROJECT_DIR\ota_monitor_$env:DEVICE_ID.log"
      '{}' | Set-Content -Encoding ASCII $monitorResults
      'monitor started' | Set-Content -Encoding ASCII $monitorLog
      python -u "$env:CI_PROJECT_DIR\tools\ci\ota_boundary_reservation.py" `
        --action assert `
        --device-id "$env:DEVICE_ID" `
        --owner "$($env:CI_PROJECT_ID):$($env:CI_PIPELINE_ID):$($env:DEVICE_ID)" `
        --project-id "$env:CI_PROJECT_ID" `
        --pipeline-id "$env:CI_PIPELINE_ID" `
        --pipeline-url "$env:CI_PIPELINE_URL" `
        --ref "$env:CI_COMMIT_REF_NAME" `
        --state-dir "$env:OTA_BOUNDARY_RESERVATION_ROOT" `
        --stale-seconds "$env:OTA_BOUNDARY_RESERVATION_STALE_SECONDS"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $v2 = [int]$env:CI_PIPELINE_IID * 2 + 1
      python -u "$env:CI_PROJECT_DIR\test_scripts\uart_test\test_ota.py" `
        --mode monitor `
        --device-id "$env:DEVICE_ID" `
        --expected-build "$v2" `
        --timeout 600 `
        --monitor-results-out "$monitorResults" 2>&1 | Tee-Object -FilePath $monitorLog
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - ota_monitor_results_*.json
      - ota_monitor_*.log
    expire_in: 1 week
