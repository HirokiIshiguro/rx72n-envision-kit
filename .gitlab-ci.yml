stages:
  - build
  - flash_boot
  - flash
  - download
  - observe
  - smoke_test
  - provision
  - health
  - test
  - ota_prepare
  - ota_run
  - ota_finalize

include:
  - local: ".gitlab-ci.device-linux.yml"
    rules:
      - if: $RUN_V3_BUILD_ONLY == "true"
        when: never
      - if: '$DEVICE_RUNNER_PLATFORM != "windows"'
  - local: ".gitlab-ci.device-windows.yml"
    rules:
      - if: $RUN_V3_BUILD_ONLY == "true"
        when: never
      - if: '$DEVICE_RUNNER_PLATFORM == "windows"'

# すべての実ジョブが rules: ベースに揃ったため、MR パイプラインを許可する。
# open MR があるブランチへの通常 push は重複実行を避けるため抑止し、
# MR 判定は merge_request_event 側の pipeline を基準にする。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $DEVICE_RUNNER_PLATFORM == "windows"'
      variables:
        DEVICE_ID: "rx72n-01"
        MAC_ADDR: "${MAC_ADDR_ENVISION_KIT_RX72N1}"
        UART_PORT: "COM7"
        COMMAND_PORT: "COM6"
        DEVICE_RESOURCE_GROUP: "rx72n-device-01"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$DEVICE_RUNNER_PLATFORM == "windows"'
      variables:
        DEVICE_ID: "rx72n-01"
        MAC_ADDR: "${MAC_ADDR_ENVISION_KIT_RX72N1}"
        UART_PORT: "COM7"
        COMMAND_PORT: "COM6"
        DEVICE_RESOURCE_GROUP: "rx72n-device-01"
    - when: always

variables:
  # Device runner switch:
  #   linux   -> Raspberry Pi #3 + RX72N Envision Kit #3 (tag: dev-ek-rx72n-set2)
  #   windows -> ishiguro-pc + RX72N Envision Kit #1 (USB 抜き保留中)
  DEVICE_RUNNER_PLATFORM: "linux"
  E2STUDIO: "C:\\Renesas\\e2_studio_2025_12\\eclipse\\e2studioc.exe"
  WORKSPACE: "C:\\workspace_rx72n"
  E2STUDIO_PROJECTS: "projects_legacy/renesas/rx72n_envision_kit/e2studio"
  # Renesas Flash Programmer CLI
  RFP_CLI: "rfp-cli"
  RFP_SPEED: "1500K"
  # --- ハードウェア依存変数（hardware-config リポジトリの CI/CD Variables から取得） ---
  # 既定は Linux device runner (Raspberry Pi #3 + RX72N Envision Kit #3, tag: dev-ek-rx72n-set2)。
  # 2026-04-14 の Runner tag 整理で set2 tag は RPi#3 を指すようになった。
  # DEVICE_RUNNER_PLATFORM=windows では ishiguro-pc + RX72N Envision Kit #1 へ切り替える (現在 #1 は USB 抜き保留中)。
  # 最新の台帳は hardware-config の CLAUDE.md を参照する。
  # E2 Lite シリアル番号 (ECN1 コネクタ)
  E2LITE_SERIAL: "${E2L_SERIAL_ENVISION_KIT_RX72N_ECN1}"
  # UART ログ / ダウンロード用（CN6 PMOD FTDI, SCI7, 921600bps）
  # set2 (RPi#3 + ENVK #3) 固定。/oss group CI/CD Variables の stable by-id path を使用する。
  # 実験・高速ログ用途の推奨経路 (PMOD-USB 変換ボード必要)。
  UART_PORT: "${UART_PORT_ENVISION_KIT_RX72N_CN6_RPI3}"
  UART_BAUD_RATE: "921600"
  UART_TIMEOUT_SEC: "30"
  # コマンドインターフェース用（CN8 USB Serial, SCI2, 115200bps）
  # set2 (RPi#3 + ENVK #3) 固定。/oss group CI/CD Variables の stable by-id path を使用する。
  # オンボード既定経路 (追加パーツ不要、低ボーレート)。
  COMMAND_PORT: "${UART_PORT_ENVISION_KIT_RX72N_CN8_RPI3}"
  COMMAND_BAUD_RATE: "115200"
  # デバイス ID と MAC address は set2 (ENVK #3) 固定。
  DEVICE_ID: "rx72n-03"
  MAC_ADDR: "${MAC_ADDR_ENVISION_KIT_RX72N3}"
  # Raspberry Pi #3 (set2) 固定。Windows OTA jobs から boundary lease を
  # 同じ Pi 上で assert/release するために使う。
  PI_HOST: "192.168.10.104"
  # RPi#3 は 3 E2 Lite 同居 (RX72N ENVK #3 / TB-RX671 / Recotto CBT) のため
  # serial 明示必須。generic `e2l` を使うと rfp-cli が最初に列挙されたデバイスを
  # 選び、意図しない板へ書き込む危険がある (2026-04-14 pipeline #2835 で Recotto CBT
  # の E2 Lite `5ES008000` に RX72N boot_loader を誤書きした事例あり)。
  RFP_TOOL: "e2l:OBE110008"
  DEVICE_RESOURCE_GROUP: "rx72n-device-03"
  # legacy OTA の split jobs 間で DEVICE_ID 単位の boundary lease を共有する。
  OTA_BOUNDARY_RESERVATION_ROOT: "/tmp/gitlab-ota-boundary"
  OTA_BOUNDARY_RESERVATION_STALE_SECONDS: "1800"
  # Git サブモジュール初期化（coreSNTP 等の外部ライブラリ）
  GIT_SUBMODULE_STRATEGY: recursive
  # Windows 260文字パス長制限の回避
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"
  # GIT_CLONE_PATH: $CI_BUILDS_DIR/rx72n
  # ↑ Runner の config.toml で [runners.custom_build_dir] enabled = true が必要。
  #   パス長が問題になった場合に有効化する。
  #
  # --- パイプライン条件分岐 ---
  # GitLab UI の「Run Pipeline」画面でオーバーライド可能。
  # RUN_AWS_TESTS:      AWS 接続テスト (provision, MQTT) を実行するか
  # RUN_SD_UPDATE_TEST: SD カードファームウェア更新テストを実行するか
  # RUN_OTA_TEST:       OTA テスト (build_ota, prepare_ota, ota_create_job,
  #                     ota_monitor, ota_finalize) を実行するか
  # RUN_HW_HEALTHCHECK: 実機の段階的ヘルスチェックを実行するか
  # RUN_RFP_SOAK_TEST:  RFP/E2 Lite の切り分け用 soak test を実行するか
  # RFP_SOAK_MODE:      sig | flash_boot
  # RFP_SOAK_LOOPS:     soak test の反復回数
  # RFP_SOAK_SLEEP_SECONDS: 各反復間の待ち時間（秒）
  # デフォルトは SD カード更新テストを除く通常テスト。
  # フルテストを実施したい場合は RUN_SD_UPDATE_TEST=true を指定する。
  RUN_AWS_TESTS: "true"
  RUN_SD_UPDATE_TEST: "false"
  RUN_OTA_TEST: "false"
  RUN_RFP_SOAK_TEST: "false"
  RFP_SOAK_MODE: "sig"
  RFP_SOAK_LOOPS: "25"
  RFP_SOAK_SLEEP_SECONDS: "1"
  RUN_HW_HEALTHCHECK: "false"
  # BUILD_USE_SOURCE_MAC_ADDR: "true" の場合のみビルド前に FreeRTOSConfig.h の
  # configMAC_ADDR* を書き換える。通常は dataflash の MAC override を使うため
  # "false" のままにし、build artifact を 3 台で共通化する。
  BUILD_USE_SOURCE_MAC_ADDR: "false"
  # download_aws_demos 完了直後の全景キャプチャを有効化する。
  CAPTURE_AFTER_AWS_DEMOS: "true"
  CAPTURE_VIDEO_DEVICE: "MonsterX U3.0R Capture 0"
  CAPTURE_FILTER: ""
  # RUN_OTA_ONLY: OTA テストのみ実行するショートカットモード。
  # "true" にすると通常のビルド/フラッシュ/テストジョブをスキップし、
  # build_ota → prepare_ota → ota_create_job/ota_monitor → ota_finalize のみ実行する。
  # OTA デバッグ中のイテレーション高速化用。安定後は "false" に戻すこと。
  RUN_OTA_ONLY: "false"
  # RUN_OTA_BOUNDARY_ONLY: `prepare_ota -> ota_create_job -> ota_monitor` 境界の
  # 再現専用モード。legacy OTA の build_ota は流すが、通常ジョブと ota_finalize は止める。
  RUN_OTA_BOUNDARY_ONLY: "false"
  # RUN_PREPARE_OTA_ONLY: build_ota -> prepare_ota のみを実行する最小再現モード。
  # RUN_OTA_ONLY=true と併用し、ota_create_job / ota_monitor / ota_finalize を止める。
  RUN_PREPARE_OTA_ONLY: "false"
  # PREPARE_OTA_STOP_AFTER:
  #   ""         : 既定の full prepare_ota
  #   "flash"    : boot_loader flash 完了で停止
  #   "uart"     : UART download 完了で停止
  #   "provision": provisioning 完了で停止
  PREPARE_OTA_STOP_AFTER: ""
  # RUN_V3_BUILD_ONLY: Phase 8b 第3次 段階1 (Issue #40) の iot-reference-rx canonical
  # 構成に対する build-only gate。"true" のとき legacy build/flash/OTA ジョブを
  # すべて止め、Windows runner 上で build_v3_rx72n のみを実行する。
  # 既定は "false" で master pipeline 無影響。段階1 検証時に MR 側で true にする。
  RUN_V3_BUILD_ONLY: "false"
  # RUN_V3_BASELINE: Phase 8b 第3次 段階2 (Issue #42) の v3 実機 baseline gate。
  # "true" のとき legacy 実機系ジョブを全 skip し、build_v3_rx72n →
  # flash_v3_boot_rx72n (manual 承認) → download_v3_app_rx72n → smoke_v3_rx72n
  # のみを実行する。実機影響 (RX72N ENVK #3 = set2) のため flash は when: manual
  # による人間承認必須。既定は "false" で master pipeline 無影響。
  RUN_V3_BASELINE: "false"
  RX72N_V3_SIGNING_KEY: "sample_keys/secp256r1.privatekey"

.windows_ota_aws_job:
  tags:
    - run_ishiguro_machine
  environment:
    # AWS credential variables are environment-scoped to ota-aws-control.
    name: ota-aws-control
  before_script:
    - |
      if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
        Write-Host "ERROR: aws CLI not found on this runner."
        exit 1
      }
      python -m pip install --quiet --user cryptography

.windows_capture_job:
  tags:
    - run_ishiguro_machine
  resource_group: rx72n-camera


build:
  stage: build
  tags:
    - run_ishiguro_machine
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - when: always
  script:
    # MAC アドレス書き換え（hardware-config リポジトリのスクリプトを使用）
    - |
      if (($env:BUILD_USE_SOURCE_MAC_ADDR -eq "true") -and $env:MAC_ADDR) {
        Write-Host "=== Set MAC address: $env:MAC_ADDR ==="
        $hcDir = "C:\tmp\hardware-config"
        if (-not (Test-Path "$hcDir\scripts\set_mac_address.py")) {
          if (Test-Path $hcDir) { Remove-Item -Recurse -Force $hcDir }
          git clone --depth 1 "$env:CI_SERVER_URL/oss/infra/hardware-config.git" $hcDir
        }
        python "$hcDir\scripts\set_mac_address.py" --mac $env:MAC_ADDR `
          "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos\config_files\FreeRTOSConfig.h"
      } else {
        Write-Host "[INFO] Skipping source MAC rewrite. Runtime MAC is expected from dataflash."
      }
    # ワークスペースと HardwareDebug をクリア（stale Makefile とキャッシュの除去）
    - if (Test-Path "$env:WORKSPACE") { Remove-Item -Recurse -Force "$env:WORKSPACE" }
    - |
      @("aws_demos", "boot_loader", "segger_emwin_demos") | ForEach-Object {
        $hd = "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\$_\HardwareDebug"
        if (Test-Path $hd) { Remove-Item -Recurse -Force $hd; Write-Host "Cleared: $hd" }
      }
    # Windows 260文字パス長制限ワークアラウンド:
    # e2studio の CDT managed build は ${ProjDirPath}/../../../../../vendors/... パターンで
    # インクルードパスを生成する。GitLab Runner のチェックアウトパスが長い場合（約80文字）、
    # ${ProjDirPath}（約137文字）+ /../../../../../ + vendors/.../ + header.h が
    # 260文字を超えて CC-RX が F0520005 (Cannot open source file) になる。
    # 解決策: CI_PROJECT_DIR への短いジャンクションを作成し、そこからプロジェクトをインポート。
    # これにより ${ProjDirPath} が約65文字に短縮される。
    - |
      $shortRoot = "C:\rx72n-src"
      if (Test-Path $shortRoot) { cmd /c "rmdir `"$shortRoot`"" 2>$null }
      New-Item -ItemType Junction -Path $shortRoot -Target "$env:CI_PROJECT_DIR" | Out-Null
      Write-Host "Junction: $shortRoot -> $env:CI_PROJECT_DIR"
      Write-Host "  CI_PROJECT_DIR length: $($env:CI_PROJECT_DIR.Length) chars"
      Write-Host "  Short root length:     $($shortRoot.Length) chars"
      Write-Host "  Saved:                 $($env:CI_PROJECT_DIR.Length - $shortRoot.Length) chars"
    # aws_demos リンクファイル解決ワークアラウンド:
    # aws_demos は AWS FreeRTOS のポーティング構造に従い、ソースファイルを
    # vendors/ 配下にリンクファイル（.project の linkedResources）で参照している。
    # e2studio ヘッドレスビルドでは一部のリンクリソースが解決されないため、
    # ジャンクションを作成してリンクリソースを物理化する。
    - |
      $awsProj    = "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos"
      $vendorsAws = "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos"

      # 前回の CI ランの残骸があれば安全に除去（ジャンクションは rmdir で除去しないと
      # ターゲットの中身まで消える）
      @("$awsProj\src\smc_gen", "$awsProj\application_code", "$awsProj\config_files") | ForEach-Object {
        if (Test-Path $_) { cmd /c "rmdir `"$_`"" 2>$null; Remove-Item $_ -Recurse -Force -ErrorAction SilentlyContinue }
      }

      # src/smc_gen: インクルードパスの解決のみ（r_config サブディレクトリのみジャンクション化）
      # 注意: src/smc_gen 全体をジャンクションにすると、.project の
      # application_code/smc_gen リンクリソース（同じ物理ディレクトリを参照）と二重コンパイルされ
      # E0562300 (Duplicate symbol) になる。r_config のみ作成すればインクルードパスが解決する。
      New-Item -ItemType Directory -Path "$awsProj\src\smc_gen" -Force | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\src\smc_gen\r_config" -Target "$vendorsAws\src\smc_gen\r_config" | Out-Null
      Write-Host "Junction: src/smc_gen/r_config -> vendors/.../src/smc_gen/r_config (include path only)"

      # application_code: renesas_code, aws_code, smc_gen, main.c（.project の linkedResources）
      New-Item -ItemType Directory -Path "$awsProj\application_code" -Force | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\application_code\renesas_code" -Target "$vendorsAws\application_code\renesas_code" | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\application_code\aws_code" -Target "$vendorsAws\application_code\aws_code" | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\application_code\smc_gen" -Target "$vendorsAws\src\smc_gen" | Out-Null
      Copy-Item "$vendorsAws\application_code\main.c" "$awsProj\application_code\main.c"
      Write-Host "Junction: application_code/{renesas_code,aws_code,smc_gen} -> vendors/..."

      # config_files: FreeRTOS/AWS 設定ヘッダ群
      New-Item -ItemType Junction -Path "$awsProj\config_files" -Target "$vendorsAws\config_files" | Out-Null
      Write-Host "Junction: config_files -> vendors/.../config_files"
    # ビルド実行（インポート + cleanBuild）
    # 短いジャンクションパスからインポートすることで ${ProjDirPath} を短縮
    - |
      $shortRoot = "C:\rx72n-src"
      $shortProj = "$shortRoot\$env:E2STUDIO_PROJECTS"
      $logFile = "$env:CI_PROJECT_DIR\e2studio_build.log"
      $e2base = @("--launcher.suppressErrors", "-nosplash", "-application", "org.eclipse.cdt.managedbuilder.core.headlessbuild", "-data", "$env:WORKSPACE")
      $imports = @("-import", "$shortProj\aws_demos", "-import", "$shortProj\boot_loader", "-import", "$shortProj\segger_emwin_demos")

      Write-Host "=== Import + cleanBuild all ==="
      Write-Host "Import paths (short junction):"
      Write-Host "  aws_demos:          $shortProj\aws_demos"
      Write-Host "  boot_loader:        $shortProj\boot_loader"
      Write-Host "  segger_emwin_demos: $shortProj\segger_emwin_demos"
      Write-Host "(e2studio output saved to e2studio_build.log artifact)"
      # Tee-Object でファイルに保存しつつ Out-Null で job log への出力を抑制（4MB 制限回避）
      & "$env:E2STUDIO" @e2base @imports -cleanBuild all 2>&1 | Tee-Object -FilePath $logFile | Out-Null
      $e2exit = $LASTEXITCODE
      Write-Host "e2studio exit code: $e2exit"
      $logSize = (Get-Item $logFile -ErrorAction SilentlyContinue).Length
      Write-Host "Build log size: $([Math]::Round($logSize / 1MB, 2)) MB"

      # 診断: ビルドログの末尾30行
      Write-Host "--- Build log tail ---"
      Get-Content $logFile -Tail 30 | ForEach-Object { Write-Host "  $_" }

      # make レシピエラーの前後コンテキストを表示（実際のコンパイラエラーを特定）
      $recipeErrors = Select-String -Path $logFile -Pattern '\*\*\* \[' -Context 15,2 -ErrorAction SilentlyContinue
      if ($recipeErrors) {
        Write-Host "--- Compilation errors with context ($($recipeErrors.Count) targets failed) ---"
        $recipeErrors | Select-Object -First 5 | ForEach-Object {
          Write-Host ""
          $_.Context.PreContext | ForEach-Object { Write-Host "  > $_".Substring(0, [Math]::Min($_.Length + 4, 250)) }
          Write-Host "  >>> $($_.Line.Substring(0, [Math]::Min($_.Line.Length, 250)))"
          $_.Context.PostContext | ForEach-Object { Write-Host "  > $_".Substring(0, [Math]::Min($_.Length + 4, 250)) }
        }
      }

      # CC-RX コンパイラエラー検出（E0520=error, F0520=fatal, W0520=warning）
      $ccrxErrors = Select-String -Path $logFile -Pattern '^[EFW]\d{4}' -ErrorAction SilentlyContinue
      if ($ccrxErrors) {
        Write-Host ""
        Write-Host "--- CC-RX compiler errors/warnings ($($ccrxErrors.Count) lines) ---"
        $ccrxErrors | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.LineNumber): $($_.Line.Substring(0, [Math]::Min($_.Line.Length, 250)))" }
      }

      # make の終了ステータス行
      $makeStatus = Select-String -Path $logFile -Pattern '(terminated with exit code|Build might be incomplete|\*\*\* No rule)' -ErrorAction SilentlyContinue
      if ($makeStatus) {
        Write-Host ""
        Write-Host "--- Make status lines ---"
        $makeStatus | ForEach-Object { Write-Host "  $($_.LineNumber): $($_.Line.Substring(0, [Math]::Min($_.Line.Length, 250)))" }
      }

      # .mot ファイルを検索
      # ビルド出力先はジャンクション経由のソースディレクトリ（ワークスペースには .metadata のみ）
      $mot_aws   = Get-ChildItem "$shortProj\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot_aws) { $mot_aws = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      $mot_boot  = Get-ChildItem "$env:WORKSPACE\rx72n_boot_loader\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot_boot) { $mot_boot = Get-ChildItem "$shortProj\boot_loader\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      if (-not $mot_boot) { $mot_boot = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\boot_loader\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      $mot_emwin = Get-ChildItem "$env:WORKSPACE\segger_emwin_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot_emwin) { $mot_emwin = Get-ChildItem "$shortProj\segger_emwin_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      if (-not $mot_emwin) { $mot_emwin = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\segger_emwin_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }

      # 診断: 見つかった .mot ファイルの一覧
      Write-Host ""
      Write-Host "--- .mot search results ---"
      Write-Host "  aws_demos:          $(if ($mot_aws) { $mot_aws.FullName } else { 'NOT FOUND' })"
      Write-Host "  boot_loader:        $(if ($mot_boot) { $mot_boot.FullName } else { 'NOT FOUND' })"
      Write-Host "  segger_emwin_demos: $(if ($mot_emwin) { $mot_emwin.FullName } else { 'NOT FOUND' })"

      $missing = @()
      if (-not $mot_aws)   { $missing += "aws_demos" }
      if (-not $mot_boot)  { $missing += "boot_loader" }
      if (-not $mot_emwin) { $missing += "segger_emwin_demos" }
      if ($missing.Count -gt 0) {
        Write-Host "ERROR: .mot file not found for: $($missing -join ', ')"
        Write-Host "Full e2studio log saved as artifact: e2studio_build.log"
        exit 1
      }

      Write-Host ""
      Write-Host "All 3 .mot files generated successfully!"

      Write-Host "Build artifacts (via junction = CI_PROJECT_DIR):"
      Write-Host "  aws_demos:          $($mot_aws.FullName)"
      Write-Host "  boot_loader:        $($mot_boot.FullName)"
      Write-Host "  segger_emwin_demos: $($mot_emwin.FullName)"
  artifacts:
    when: always
    paths:
      - e2studio_build.log
      - projects_legacy/renesas/rx72n_envision_kit/e2studio/aws_demos/HardwareDebug/*.mot
      - projects_legacy/renesas/rx72n_envision_kit/e2studio/boot_loader/HardwareDebug/*.mot
      - projects_legacy/renesas/rx72n_envision_kit/e2studio/segger_emwin_demos/HardwareDebug/*.mot
    expire_in: 1 week

build_v3_rx72n:
  stage: build
  tags:
    - run_ishiguro_machine
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
    - if: $RUN_V3_BASELINE == "true"
    - when: never
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - |
      Write-Host "=== RX72N v3 build (iot-reference-rx canonical layout) ==="
      Write-Host "Project root: $env:CI_PROJECT_DIR"
      Write-Host "Workspace   : C:\rx72n-v3-ws"
      python -m pip install --quiet --user cryptography
      & "$env:CI_PROJECT_DIR\tools\ci\build_v3_rx72n_headless.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -E2Studio    "$env:E2STUDIO" `
        -Workspace   "C:\rx72n-v3-ws" `
        -ProjectsPath "Projects" `
        -LogFile     "$env:CI_PROJECT_DIR\rx72n_v3_e2studio_build.log" `
        -SigningKey  "$env:RX72N_V3_SIGNING_KEY"
  artifacts:
    when: always
    paths:
      - rx72n_v3_e2studio_build.log
      - rx72n_app.rsu
      - rx72n_codesign_cert.pem
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 week

.v3_pi_job:
  tags:
    - exec-shell
    - os-linux
    - hw-raspi
    - dev-ek-rx72n
    - dev-ek-rx72n-set2
  resource_group: $DEVICE_RESOURCE_GROUP
  before_script:
    - source "$CI_PROJECT_DIR/tools/ci/activate_pi_python.sh" pyserial cryptography

flash_v3_boot_rx72n:
  stage: flash_boot
  extends: .v3_pi_job
  rules:
    - if: $RUN_V3_BASELINE == "true"
      when: manual
    - when: never
  needs:
    - job: build_v3_rx72n
      artifacts: true
  script:
    - set -e
    - 'echo "=== v3 - erase-chip + flash boot_loader (bank0 + bank1) ==="'
    - echo "Device=RX72x Tool=$RFP_TOOL Speed=$RFP_SPEED"
    - >-
      "$RFP_CLI" -device RX72x -tool "$RFP_TOOL" -if fine -speed "$RFP_SPEED"
      -auth id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF -erase-chip -noquery
    - >-
      "$RFP_CLI" -device RX72x -tool "$RFP_TOOL" -if fine -speed "$RFP_SPEED"
      -auth id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF
      -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit.mot"
      -v -noquery
    - >-
      "$RFP_CLI" -device RX72x -tool "$RFP_TOOL" -if fine -speed "$RFP_SPEED"
      -auth id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF
      -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit_bank1.mot"
      -v -run -noquery
  artifacts:
    when: always
    paths:
      - flash_v3_boot_rx72n.log
    expire_in: 1 week

download_v3_app_rx72n:
  stage: download
  extends: .v3_pi_job
  rules:
    - if: $RUN_V3_BASELINE == "true"
    - when: never
  needs:
    - job: build_v3_rx72n
      artifacts: true
    - job: flash_v3_boot_rx72n
      artifacts: false
  script:
    - set -e
    - 'echo "=== v3 - UART download rx72n_app.rsu via boot_loader ==="'
    - >-
      python3 "$CI_PROJECT_DIR/tools/v3/test_uart_download_rx72n.py"
      --rsu "$CI_PROJECT_DIR/rx72n_app.rsu"
      --port "$UART_PORT"
      --baud "$UART_BAUD_RATE"
      --timeout 420
      --post-tx-wait 120
      --diag
      --wait-for-ready
      --ready-timeout 90
      --reset-cmd "$RFP_CLI -device RX72x -tool $RFP_TOOL -if fine -speed $RFP_SPEED -auth id FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF -sig -run -noquery"
      2>&1 | tee "$CI_PROJECT_DIR/download_v3_app.log"
  artifacts:
    when: always
    paths:
      - download_v3_app.log
    expire_in: 1 week

smoke_v3_rx72n:
  stage: smoke_test
  extends: .v3_pi_job
  timeout: 5 minutes
  rules:
    - if: $RUN_V3_BASELINE == "true"
    - when: never
  needs:
    - job: download_v3_app_rx72n
      artifacts: false
  script:
    - set -e
    - 'echo "=== v3 - smoke_test (boot banner + CLI prompt on UART_PORT) ==="'
    - |
      python3 - "$UART_PORT" "$UART_BAUD_RATE" <<'PY' | tee "$CI_PROJECT_DIR/smoke_v3.log"
      import sys, time, serial
      port, baud = sys.argv[1], int(sys.argv[2])
      ser = serial.Serial(port, baud, timeout=0.2)
      buf = b""
      t0 = time.time()
      timeout = 90.0
      banner_seen = False
      prompt_seen = False
      while time.time() - t0 < timeout:
          data = ser.read(4096)
          if data:
              sys.stdout.write(data.decode(errors='replace'))
              sys.stdout.flush()
              buf += data
              buf = buf[-8192:]
              # Any of the following are accepted as "app booted":
              if b"FreeRTOS" in buf or b"IoT" in buf or b"coreMQTT" in buf:
                  banner_seen = True
              if b"> " in buf[-20:] or buf.endswith(b"$ "):
                  prompt_seen = True
          if banner_seen or prompt_seen:
              ser.write(b"\r\n")
              time.sleep(0.5)
              more = ser.read(4096)
              if more:
                  sys.stdout.write(more.decode(errors='replace'))
                  sys.stdout.flush()
              break
      ser.close()
      print(f"\n[SMOKE] banner_seen={banner_seen} prompt_seen={prompt_seen} elapsed={time.time()-t0:.1f}s")
      sys.exit(0 if (banner_seen or prompt_seen) else 1)
      PY
  artifacts:
    when: always
    paths:
      - smoke_v3.log
    expire_in: 1 week


capture_after_download_aws_demos:
  stage: observe
  extends:
    - .windows_capture_job
  allow_failure: true
  when: always
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
    - if: $CAPTURE_AFTER_AWS_DEMOS == "true"
    - when: never
  script:
    - |
      $captureDir = "$env:CI_PROJECT_DIR\camera_capture"
      $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
      $imagePath = "$captureDir\monsterx_after_aws_demos_$timestamp.jpg"
      $devicesLog = "$captureDir\monsterx_after_aws_demos_${timestamp}_devices.txt"
      New-Item -ItemType Directory -Force -Path $captureDir | Out-Null
      & "$env:CI_PROJECT_DIR\tools\ci\capture_monsterx_frame.ps1" `
        -OutputPath $imagePath `
        -DevicesLogPath $devicesLog `
        -VideoDeviceName $env:CAPTURE_VIDEO_DEVICE `
        -Filter $env:CAPTURE_FILTER
  artifacts:
    when: always
    paths:
      - camera_capture/*.jpg
      - camera_capture/*.txt
    expire_in: 1 week

# ==============================================================================
# Phase 7: AWS IoT OTA テスト
# RUN_OTA_TEST=false でスキップ可能。
# OTA テストには2つの異なるバージョンの FW が必要:
#   v1 (APP_VERSION_BUILD=N)   : デバイスに初期書き込み。OTA Agent が稼働しジョブ待機
#   v2 (APP_VERSION_BUILD=N+1) : S3 にアップロードし OTA で配信
# ==============================================================================

build_ota:
  stage: build
  tags:
    - run_ishiguro_machine
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
    - if: $RUN_OTA_TEST == "true"
  script:
    # MAC アドレス書き換え（build ジョブと同じ）
    - |
      if (($env:BUILD_USE_SOURCE_MAC_ADDR -eq "true") -and $env:MAC_ADDR) {
        Write-Host "=== Set MAC address: $env:MAC_ADDR ==="
        $hcDir = "C:\tmp\hardware-config"
        if (-not (Test-Path "$hcDir\scripts\set_mac_address.py")) {
          if (Test-Path $hcDir) { Remove-Item -Recurse -Force $hcDir }
          git clone --depth 1 "$env:CI_SERVER_URL/oss/infra/hardware-config.git" $hcDir
        }
        python "$hcDir\scripts\set_mac_address.py" --mac $env:MAC_ADDR `
          "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos\config_files\FreeRTOSConfig.h"
      } else {
        Write-Host "[INFO] Skipping source MAC rewrite. Runtime MAC is expected from dataflash."
      }
    # ワークスペースと HardwareDebug をクリア
    - if (Test-Path "$env:WORKSPACE") { Remove-Item -Recurse -Force "$env:WORKSPACE" }
    - |
      @("aws_demos", "boot_loader") | ForEach-Object {
        $hd = "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\$_\HardwareDebug"
        if (Test-Path $hd) { Remove-Item -Recurse -Force $hd; Write-Host "Cleared: $hd" }
      }
    # ジャンクション作成（build ジョブと同じ）
    - |
      $shortRoot = "C:\rx72n-src"
      if (Test-Path $shortRoot) { cmd /c "rmdir `"$shortRoot`"" 2>$null }
      New-Item -ItemType Junction -Path $shortRoot -Target "$env:CI_PROJECT_DIR" | Out-Null
      Write-Host "Junction: $shortRoot -> $env:CI_PROJECT_DIR"
    - |
      $awsProj    = "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos"
      $vendorsAws = "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos"
      @("$awsProj\src\smc_gen", "$awsProj\application_code", "$awsProj\config_files") | ForEach-Object {
        if (Test-Path $_) { cmd /c "rmdir `"$_`"" 2>$null; Remove-Item $_ -Recurse -Force -ErrorAction SilentlyContinue }
      }
      New-Item -ItemType Directory -Path "$awsProj\src\smc_gen" -Force | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\src\smc_gen\r_config" -Target "$vendorsAws\src\smc_gen\r_config" | Out-Null
      New-Item -ItemType Directory -Path "$awsProj\application_code" -Force | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\application_code\renesas_code" -Target "$vendorsAws\application_code\renesas_code" | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\application_code\aws_code" -Target "$vendorsAws\application_code\aws_code" | Out-Null
      New-Item -ItemType Junction -Path "$awsProj\application_code\smc_gen" -Target "$vendorsAws\src\smc_gen" | Out-Null
      Copy-Item "$vendorsAws\application_code\main.c" "$awsProj\application_code\main.c"
      New-Item -ItemType Junction -Path "$awsProj\config_files" -Target "$vendorsAws\config_files" | Out-Null
      Write-Host "Junctions created for OTA build"
    # aws_demo_config.h を OTA モードに切り替え
    # MQTT Mutual Auth デモを無効化し、OTA MQTT Update デモを有効化
    - |
      $configFile = "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos\config_files\aws_demo_config.h"
      Write-Host "=== Switching to OTA demo mode ==="
      (Get-Content $configFile) `
        -replace '^#define CONFIG_CORE_MQTT_MUTUAL_AUTH_DEMO_ENABLED', '//#define CONFIG_CORE_MQTT_MUTUAL_AUTH_DEMO_ENABLED' |
        Set-Content $configFile
      Add-Content $configFile "`n#define CONFIG_OTA_MQTT_UPDATE_DEMO_ENABLED`n"
      Write-Host "  Disabled: CONFIG_CORE_MQTT_MUTUAL_AUTH_DEMO_ENABLED"
      Write-Host "  Enabled:  CONFIG_OTA_MQTT_UPDATE_DEMO_ENABLED"
    # OTA build は安定性優先で並列 build を止める。
    # recent rerun で aws_demos の headless OTA build が sporadic に落ちているため、
    # 通常 build より保守的な設定を使う。
    - |
      $otaProjects = @(
        "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\.cproject",
        "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\boot_loader\.cproject"
      )
      foreach ($project in $otaProjects) {
        if (-not (Test-Path $project)) {
          Write-Host "ERROR: .cproject not found: $project"
          exit 1
        }
        $content = Get-Content $project -Raw
        $updated = $content `
          -replace 'parallelBuildOn="true"', 'parallelBuildOn="false"' `
          -replace 'parallelizationNumber="optimal"', 'parallelizationNumber="1"'
        Set-Content -Path $project -Value $updated -Encoding UTF8
        Write-Host "  Parallel build disabled: $project"
      }
    # バージョン番号を v1 に設定 (CI_PIPELINE_IID * 2)
    # OTA はダウングレード禁止 (otaconfigAllowDowngrade=0) のため、
    # パイプラインごとに一意のバージョン番号が必要
    - |
      $otaConfig = "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos\config_files\ota_demo_config.h"
      $v1 = [int]$env:CI_PIPELINE_IID * 2
      Write-Host "=== Setting OTA version: v1 (build=$v1) ==="
      (Get-Content $otaConfig) -replace 'APP_VERSION_BUILD\s+\d+', "APP_VERSION_BUILD    $v1" | Set-Content $otaConfig
    # v1 ビルド (OTA Agent 稼働ファームウェア)
    - |
      $shortRoot = "C:\rx72n-src"
      $shortProj = "$shortRoot\$env:E2STUDIO_PROJECTS"
      $logFile = "$env:CI_PROJECT_DIR\e2studio_ota_build.log"
      $e2base = @("--launcher.suppressErrors", "-nosplash", "-application", "org.eclipse.cdt.managedbuilder.core.headlessbuild", "-data", "$env:WORKSPACE")
      $imports = @("-import", "$shortProj\aws_demos", "-import", "$shortProj\boot_loader")
      # workspace は毎回作り直すため cleanBuild は不要。
      # clean ステップは "No rule to make target 'clean'" を noisy に出すだけなので、
      # OTA build では build のみを実行する。
      Write-Host "=== Build v1 (aws_demos + boot_loader) ==="
      & "$env:E2STUDIO" @e2base @imports -build all 2>&1 | Tee-Object -FilePath $logFile | Out-Null
      Write-Host "e2studio exit code: $LASTEXITCODE"

      # 診断: ビルドログの末尾20行
      Write-Host "--- Build log tail ---"
      Get-Content $logFile -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }

      # .mot ファイルの検索（ジャンクション経由とCI_PROJECT_DIR直接の両方を試行）
      $mot_aws = Get-ChildItem "$shortProj\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot_aws) { $mot_aws = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      $mot_boot = Get-ChildItem "$env:WORKSPACE\rx72n_boot_loader\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot_boot) { $mot_boot = Get-ChildItem "$shortProj\boot_loader\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      if (-not $mot_boot) { $mot_boot = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\boot_loader\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      Write-Host "  aws_demos .mot:  $(if ($mot_aws) { $mot_aws.FullName } else { 'NOT FOUND' })"
      Write-Host "  boot_loader .mot: $(if ($mot_boot) { $mot_boot.FullName } else { 'NOT FOUND' })"
      if (-not $mot_aws) { Write-Host "ERROR: v1 aws_demos.mot not found"; exit 1 }
      if (-not $mot_boot) { Write-Host "ERROR: v1 boot_loader.mot not found"; exit 1 }
      Write-Host "  v1 .mot: $($mot_aws.FullName)"
    # v1.mot → ota_v1.rsu 変換
    - |
      pip install cryptography
      $mot = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot) { $mot = Get-ChildItem "C:\rx72n-src\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" }
      $v1 = [int]$env:CI_PIPELINE_IID * 2
      python "$env:CI_PROJECT_DIR\tools\mcu-tool-rx\mot_to_rsu.py" `
        --mot "$($mot.FullName)" --key "$env:CI_PROJECT_DIR\sample_keys\secp256r1.privatekey" `
        -o "$env:CI_PROJECT_DIR\ota_v1.rsu" --seq-no $v1
      Write-Host "Generated: ota_v1.rsu"
    # v2 ビルド (OTA で配信するファームウェア)
    # HardwareDebug をクリアしてバージョン番号を変更してリビルド
    - |
      $hd = "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug"
      if (Test-Path $hd) { Remove-Item -Recurse -Force $hd }
      $otaConfig = "$env:CI_PROJECT_DIR\vendors\renesas\boards\rx72n-envision-kit\aws_demos\config_files\ota_demo_config.h"
      $v2 = [int]$env:CI_PIPELINE_IID * 2 + 1
      Write-Host "=== Setting OTA version: v2 (build=$v2) ==="
      (Get-Content $otaConfig) -replace 'APP_VERSION_BUILD\s+\d+', "APP_VERSION_BUILD    $v2" | Set-Content $otaConfig
    - |
      $shortRoot = "C:\rx72n-src"
      $shortProj = "$shortRoot\$env:E2STUDIO_PROJECTS"
      $logFile = "$env:CI_PROJECT_DIR\e2studio_ota_build_v2.log"
      $e2base = @("--launcher.suppressErrors", "-nosplash", "-application", "org.eclipse.cdt.managedbuilder.core.headlessbuild", "-data", "$env:WORKSPACE")
      # v2 は aws_demos のみ再生成したいが、workspace 上の build target は all で揃える。
      # HardwareDebug は上で消しているため build のみで十分。
      Write-Host "=== Build v2 (aws_demos only) ==="
      & "$env:E2STUDIO" @e2base -build all 2>&1 | Tee-Object -FilePath $logFile | Out-Null
      Write-Host "e2studio exit code: $LASTEXITCODE"

      # 診断: ビルドログの末尾20行
      Write-Host "--- Build log tail ---"
      Get-Content $logFile -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }

      $mot_aws = Get-ChildItem "$shortProj\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot_aws) { $mot_aws = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue }
      if (-not $mot_aws) { Write-Host "ERROR: v2 aws_demos.mot not found"; exit 1 }
      Write-Host "  v2 .mot: $($mot_aws.FullName)"
    # v2.mot → ota_v2.rsu 変換
    - |
      $mot = Get-ChildItem "$env:CI_PROJECT_DIR\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" -ErrorAction SilentlyContinue
      if (-not $mot) { $mot = Get-ChildItem "C:\rx72n-src\$env:E2STUDIO_PROJECTS\aws_demos\HardwareDebug\*.mot" }
      $v2 = [int]$env:CI_PIPELINE_IID * 2 + 1
      python "$env:CI_PROJECT_DIR\tools\mcu-tool-rx\mot_to_rsu.py" `
        --mot "$($mot.FullName)" --key "$env:CI_PROJECT_DIR\sample_keys\secp256r1.privatekey" `
        -o "$env:CI_PROJECT_DIR\ota_v2.rsu" --seq-no $v2
      Write-Host "Generated: ota_v2.rsu"
    # 結果サマリー
    - |
      $v1 = [int]$env:CI_PIPELINE_IID * 2
      $v2 = $v1 + 1
      Write-Host ""
      Write-Host "=== OTA Build Summary ==="
      Write-Host "  v1 (initial): ota_v1.rsu (APP_VERSION_BUILD=$v1)"
      Write-Host "  v2 (update):  ota_v2.rsu (APP_VERSION_BUILD=$v2)"
      if (Test-Path "$env:CI_PROJECT_DIR\ota_v1.rsu") { Write-Host "  v1 size: $((Get-Item "$env:CI_PROJECT_DIR\ota_v1.rsu").Length) bytes" }
      if (Test-Path "$env:CI_PROJECT_DIR\ota_v2.rsu") { Write-Host "  v2 size: $((Get-Item "$env:CI_PROJECT_DIR\ota_v2.rsu").Length) bytes" }
  artifacts:
    when: always
    paths:
      - ota_v1.rsu
      - ota_v2.rsu
      - e2studio_ota_build.log
      - e2studio_ota_build_v2.log
      - projects_legacy/renesas/rx72n_envision_kit/e2studio/boot_loader/HardwareDebug/*.mot
    expire_in: 1 week

ota_create_job:
  stage: ota_run
  extends:
    - .windows_ota_aws_job
  timeout: 10 minutes
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_PREPARE_OTA_ONLY == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
    - if: $RUN_OTA_TEST == "true"
  dependencies:
    - build_ota
  script:
    - |
      $owner = "$($env:CI_PROJECT_ID):$($env:CI_PIPELINE_ID):$($env:DEVICE_ID)"
      $leaseArgs = @(
        '-u',
        "$env:CI_PROJECT_DIR\tools\ci\ota_boundary_reservation.py",
        '--action', 'assert',
        '--device-id', "$env:DEVICE_ID",
        '--owner', $owner,
        '--project-id', "$env:CI_PROJECT_ID",
        '--pipeline-id', "$env:CI_PIPELINE_ID",
        '--pipeline-url', "$env:CI_PIPELINE_URL",
        '--ref', "$env:CI_COMMIT_REF_NAME",
        '--state-dir', "$env:OTA_BOUNDARY_RESERVATION_ROOT",
        '--stale-seconds', "$env:OTA_BOUNDARY_RESERVATION_STALE_SECONDS",
        '--host', "$env:PI_HOST"
      )
      & python @leaseArgs
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $v2 = [int]$env:CI_PIPELINE_IID * 2 + 1
      $metadataFile = "$env:CI_PROJECT_DIR\ota_job_metadata_$env:DEVICE_ID.json"
      Write-Host "=== AWS IoT OTA Create Job ==="
      Write-Host "  Expected version build: $v2"
      python -u "$env:CI_PROJECT_DIR\test_scripts\uart_test\test_ota.py" `
        --mode create-job `
        --device-id "$env:DEVICE_ID" `
        --rsu "$env:CI_PROJECT_DIR\ota_v2.rsu" `
        --s3-bucket "$env:OTA_S3_BUCKET" `
        --ota-role-arn "$env:OTA_ROLE_ARN" `
        --metadata-out $metadataFile
  artifacts:
    when: always
    paths:
      - ota_job_metadata_*.json
    expire_in: 1 week

ota_finalize:
  stage: ota_finalize
  extends:
    - .windows_ota_aws_job
  timeout: 10 minutes
  when: always
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_PREPARE_OTA_ONLY == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_TEST == "true"
  script:
    - |
      $owner = "$($env:CI_PROJECT_ID):$($env:CI_PIPELINE_ID):$($env:DEVICE_ID)"
      $leaseReleaseArgs = @(
        '-u',
        "$env:CI_PROJECT_DIR\tools\ci\ota_boundary_reservation.py",
        '--action', 'release',
        '--device-id', "$env:DEVICE_ID",
        '--owner', $owner,
        '--project-id', "$env:CI_PROJECT_ID",
        '--pipeline-id', "$env:CI_PIPELINE_ID",
        '--pipeline-url', "$env:CI_PIPELINE_URL",
        '--ref', "$env:CI_COMMIT_REF_NAME",
        '--state-dir', "$env:OTA_BOUNDARY_RESERVATION_ROOT",
        '--stale-seconds', "$env:OTA_BOUNDARY_RESERVATION_STALE_SECONDS",
        '--host', "$env:PI_HOST"
      )
      $metadataFile = "$env:CI_PROJECT_DIR\ota_job_metadata_$env:DEVICE_ID.json"
      $monitorResultsFile = "$env:CI_PROJECT_DIR\ota_monitor_results_$env:DEVICE_ID.json"
      $finalizeLogFile = "$env:CI_PROJECT_DIR\ota_finalize_$env:DEVICE_ID.log"
      $finalExit = 0
      try {
        if (-not (Test-Path $metadataFile) -or -not (Test-Path $monitorResultsFile)) {
          @(
            "Skipping ota_finalize because prerequisite files are missing.",
            "DEVICE_ID=$env:DEVICE_ID",
            "metadata_exists=$([bool](Test-Path $metadataFile))",
            "monitor_results_exists=$([bool](Test-Path $monitorResultsFile))"
          ) | Set-Content -Encoding UTF8 $finalizeLogFile
          Write-Host "Skipping ota_finalize because prerequisite files are missing."
          Write-Host "  metadata: $metadataFile"
          Write-Host "  monitor : $monitorResultsFile"
        } else {
          & python -u "$env:CI_PROJECT_DIR\test_scripts\uart_test\test_ota.py" `
            --mode finalize `
            --metadata-in $metadataFile `
            --monitor-results-in $monitorResultsFile 2>&1 | Tee-Object -FilePath $finalizeLogFile
          if ($LASTEXITCODE -ne 0) {
            $finalExit = $LASTEXITCODE
          }
        }
      } finally {
        & python @leaseReleaseArgs
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "OTA boundary lease release failed for $env:DEVICE_ID (exit=$LASTEXITCODE)."
        }
      }
      exit $finalExit
  artifacts:
    when: always
    paths:
      - ota_job_metadata_*.json
      - ota_monitor_results_*.json
      - ota_monitor_*.log
    expire_in: 1 week

ota_release_reservation:
  stage: ota_finalize
  extends:
    - .windows_ota_aws_job
  timeout: 5 minutes
  when: always
  rules:
    - if: $RUN_V3_BUILD_ONLY == "true"
      when: never
    - if: $RUN_V3_BASELINE == "true"
      when: never
    - if: $RUN_PREPARE_OTA_ONLY == "true"
      when: never
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
  script:
    - |
      $owner = "$($env:CI_PROJECT_ID):$($env:CI_PIPELINE_ID):$($env:DEVICE_ID)"
      $releaseArgs = @(
        '-u',
        "$env:CI_PROJECT_DIR\tools\ci\ota_boundary_reservation.py",
        '--action', 'release',
        '--device-id', "$env:DEVICE_ID",
        '--owner', $owner,
        '--project-id', "$env:CI_PROJECT_ID",
        '--pipeline-id', "$env:CI_PIPELINE_ID",
        '--pipeline-url', "$env:CI_PIPELINE_URL",
        '--ref', "$env:CI_COMMIT_REF_NAME",
        '--state-dir', "$env:OTA_BOUNDARY_RESERVATION_ROOT",
        '--stale-seconds', "$env:OTA_BOUNDARY_RESERVATION_STALE_SECONDS",
        '--host', "$env:PI_HOST"
      )
      & python @releaseArgs
      if ($LASTEXITCODE -ne 0) {
        Write-Warning "OTA boundary lease release failed for $env:DEVICE_ID (exit=$LASTEXITCODE)."
        exit 0
      }
