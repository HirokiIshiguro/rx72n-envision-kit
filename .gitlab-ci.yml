test_sd_update:
  stage: test
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  allow_failure: true
  timeout: 10 minutes
  rules:
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
      when: never
    - if: $RUN_HW_HEALTHCHECK == "true"
      when: never
    - if: $RUN_OTA_ONLY == "true"
      when: never
