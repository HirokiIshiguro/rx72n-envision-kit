confirm_aws_mqtt:
  stage: test
  extends:
    - .pc_device_job
    - .pc_pyserial_job
  allow_failure: true
  timeout: 5 minutes
  rules:
    - if: $RUN_RFP_SOAK_TEST == "true"
      when: never
    - if: $RUN_OTA_BOUNDARY_ONLY == "true"
